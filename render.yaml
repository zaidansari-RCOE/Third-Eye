services:
  - type: web
    name: third-eye-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: PYTHONPATH=src python -m uvicorn third_eye.api.asgi:create_demo_app --factory --host 0.0.0.0 --port $PORT

  - type: web
    name: third-eye-frontend
    env: static
    buildCommand: cd web && npm install && npm run build
    staticPublishPath: web/dist
    envVars:
      - key: VITE_BACKEND_URL
        value: https://third-eye-backend-1nwu.onrender.com
